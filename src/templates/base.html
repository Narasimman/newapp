<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Finance Tracker{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-dark navbar-expand-lg" id="main-nav">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-semibold" href="/">
        <i class="bi bi-graph-up-arrow me-2"></i>Finance Tracker
      </a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <span id="last-synced" class="text-white-50 small me-2"></span>
        {% if plaid_configured %}
        <button class="btn btn-outline-light btn-sm" id="sync-btn" onclick="syncTransactions()">
          <i class="bi bi-arrow-repeat me-1"></i>Sync
        </button>
        <button class="btn btn-success btn-sm" onclick="connectBank()">
          <i class="bi bi-plus-lg me-1"></i>Connect Bank
        </button>
        {% endif %}
      </div>
    </div>
  </nav>

  <div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index:1100"></div>

  <main class="container-fluid px-4 py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
